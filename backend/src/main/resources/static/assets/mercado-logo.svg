<svg width="620" height="160" viewBox="0 0 620 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mercadoTitle mercadoDesc">
  <title id="mercadoTitle">Mercado - Gesti&#243;n de Pagos</title>
  <desc id="mercadoDesc">Identidad visual profesional para Mercado Gesti&#243;n de Pagos.</desc>
  <defs>
